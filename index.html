<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Card</title>
<meta name="description" content="Show a QR code that adds you as a contact. Works offline.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QR Card">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ic-person" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.5-8 5.5V22h16v-2.5c0-3-3.6-5.5-8-5.5Z"/></symbol>
  <symbol id="ic-work" viewBox="0 0 24 24"><path d="M9 4a2 2 0 0 0-2 2v1H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3V6a2 2 0 0 0-2-2H9Zm0 2h6v1H9V6Z"/></symbol>
  <symbol id="ic-phone" viewBox="0 0 24 24"><path d="M6.4 3H4.2A2.2 2.2 0 0 0 2 5.2 16.8 16.8 0 0 0 18.8 22a2.2 2.2 0 0 0 2.2-2.2v-2.2a1 1 0 0 0-.7-1l-4-1.2a1 1 0 0 0-1 .25l-1.3 1.3a13.4 13.4 0 0 1-6-6l1.3-1.3a1 1 0 0 0 .25-1l-1.2-4a1 1 0 0 0-.95-.65Z"/></symbol>
  <symbol id="ic-mail" viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1.5 2L12 12.2 19.5 7h-15Z"/></symbol>
  <symbol id="ic-link" viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l1.4-1.4a1 1 0 0 1 1.4 1.4l-1.4 1.4a1 1 0 0 1-1.4 0Z"/><path d="M8.8 17.7 7.4 19a3.5 3.5 0 0 1-5-5l3.2-3.2a3.5 3.5 0 0 1 5 0 1 1 0 1 1-1.4 1.42 1.5 1.5 0 0 0-2.12 0L3.8 15.5a1.5 1.5 0 0 0 2.12 2.12l1.4-1.4a1 1 0 0 1 1.5 1.5Zm6.4-11.4L16.6 5a3.5 3.5 0 0 1 5 5l-3.2 3.2a3.5 3.5 0 0 1-5 0 1 1 0 1 1 1.4-1.42 1.5 1.5 0 0 0 2.12 0L20.2 8.5a1.5 1.5 0 0 0-2.12-2.12l-1.4 1.4a1 1 0 0 1-1.5-1.5Z"/></symbol>
  <symbol id="ic-pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></symbol>
  <symbol id="ic-note" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm2 6h8v2H7V9Zm0 4h8v2H7v-2Zm0 4h5v2H7v-2Z"/></symbol>
  <symbol id="ic-chevron" viewBox="0 0 24 24"><path d="M9.3 6.3a1 1 0 0 1 1.4 0l5 5a1 1 0 0 1 0 1.4l-5 5a1 1 0 0 1-1.4-1.4L13.6 12 9.3 7.7a1 1 0 0 1 0-1.4Z"/></symbol>
</svg>

<header class="appbar">
  <button class="appbar__btn appbar__btn--left" id="ab-left" type="button"></button>
  <h1 class="appbar__title" id="ab-title">QR Card</h1>
  <button class="appbar__btn appbar__btn--right" id="ab-right" type="button"></button>
</header>

<main id="view" class="view"></main>

<div id="present" class="present" hidden>
  <div class="present__qr" id="present-qr"></div>
  <p class="present__name" id="present-name"></p>
  <div class="present__actions">
    <button class="btn btn--ghost" id="present-contrast" type="button">Use plain black</button>
    <button class="btn btn--ghost" id="present-close" type="button">Done</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="./vendor/qr-code-styling.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
